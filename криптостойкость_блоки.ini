import random
import numpy as np
from tabulate import tabulate
from sklearn.neural_network import MLPRegressor
from sklearn.preprocessing import StandardScaler
from scipy.stats import chi2_contingency

def read_binary_string(filename):
    """
    Читает бинарную последовательность из файла как строку
    """
    try:
        with open(filename, 'r') as f:
            sequence = f.read().strip()
            if not all(c in '01' for c in sequence):
                print("Ошибка: Файл должен содержать только 0 и 1")
                return None
            return sequence
    except FileNotFoundError:
        print(f"Ошибка: Файл {filename} не найден")
        return None
    except Exception as e:
        print(f"Ошибка при чтении файла: {e}")
        return None

def prepare_data(sequence, window_size):
    """
    Подготовка данных для обучения нейронной сети
    """
    X, y = [], []
    for i in range(len(sequence) - window_size):
        window = [int(b) for b in sequence[i:i+window_size]]
        target = int(sequence[i+window_size])
        X.append(window)
        y.append(target)
    return np.array(X), np.array(y)

def predict_with_nn(sequence, position, window_size, predict_size, direction='next'):
    """
    Предсказание с помощью нейронной сети
    """
    if direction == 'next':
        window = sequence[position:position+window_size]
        actual = sequence[position+window_size:position+window_size+predict_size]
    else:
        window = sequence[position-window_size:position]
        actual = sequence[position-window_size-predict_size:position-window_size]
    
    X_train, y_train = prepare_data(sequence, window_size)
    scaler = StandardScaler()
    X_train_scaled = scaler.fit_transform(X_train)
    
    model = MLPRegressor(
        hidden_layer_sizes=(window_size*2, window_size),
        max_iter=1000,
        random_state=42
    )
    model.fit(X_train_scaled, y_train)
    
    predicted = ""
    current = np.array([int(b) for b in window])
    
    for _ in range(predict_size):
        current_scaled = scaler.transform(current.reshape(1, -1))
        pred = model.predict(current_scaled)[0]
        bit = '1' if pred >= 0.5 else '0'
        predicted += bit
        
        if direction == 'next':
            current = np.roll(current, -1)
            current[-1] = int(bit)
        else:
            current = np.roll(current, 1)
            current[0] = int(bit)
    
    matches = sum(a == b for a, b in zip(predicted, actual))
    accuracy = matches / predict_size if predict_size > 0 else 0
    
    return {
        'window': window,
        'predicted': predicted,
        'actual': actual,
        'accuracy': accuracy
    }

def statistical_prediction(sequence, position, window_size, predict_size, direction='next'):
    """
    Статистическое предсказание с использованием хи-квадрат
    """
    transitions = {}
    
    for i in range(len(sequence) - window_size - predict_size):
        current = sequence[i:i+window_size]
        next_block = sequence[i+window_size:i+window_size+predict_size]
        
        if current not in transitions:
            transitions[current] = {}
        if next_block not in transitions[current]:
            transitions[current][next_block] = 0
        transitions[current][next_block] += 1
    
    if direction == 'next':
        window = sequence[position:position+window_size]
        actual = sequence[position+window_size:position+window_size+predict_size]
    else:
        window = sequence[position-window_size:position]
        actual = sequence[position-window_size-predict_size:position-window_size]
    
    if window not in transitions:
        return {
            'window': window,
            'predicted': '0' * predict_size,
            'actual': actual,
            'chi_square': 0,
            'p_value': 1
        }
    
    observed = np.zeros((2, 2))
    for next_block, count in transitions[window].items():
        row = 0 if next_block == actual else 1
        observed[row][0] = count
        observed[row][1] = sum(transitions[window].values()) - count
    
    chi2, p_value, _, _ = chi2_contingency(observed + 1)
    predicted = max(transitions[window].items(), key=lambda x: x[1])[0]
    
    return {
        'window': window,
        'predicted': predicted,
        'actual': actual,
        'chi_square': chi2,
        'p_value': p_value
    }

def analyze_random_position(sequence):
    """
    Анализирует случайную позицию в последовательности
    """
    min_pos = 32
    max_pos = len(sequence) - 32
    if max_pos <= min_pos:
        print("Последовательность слишком короткая для анализа")
        return
    
    position = random.randint(min_pos, max_pos)
    print(f"\nАнализ последовательности в позиции {position}")
    
    window_sizes = [4, 8, 16, 32]
    
    # Анализ нейронной сети
    print("\n=== АНАЛИЗ С ПОМОЩЬЮ НЕЙРОННОЙ СЕТИ ===")
    nn_results = []
    nn_total_accuracy = 0
    
    for window_size in window_sizes:
        for direction in ['next', 'prev']:
            nn_result = predict_with_nn(sequence, position, window_size, window_size, direction)
            nn_results.append([
                window_size,
                'следующие' if direction == 'next' else 'предыдущие',
                nn_result['window'],
                nn_result['predicted'],
                nn_result['actual'],
                f"{nn_result['accuracy']:.2%}"
            ])
            nn_total_accuracy += nn_result['accuracy']
    
    nn_avg_accuracy = nn_total_accuracy / (len(window_sizes) * 2)
    headers = ['Размер окна', 'Направление', 'Окно', 'Предсказано', 'Фактически', 'Точность']
    print(tabulate(nn_results, headers=headers, tablefmt='grid'))
    print(f"\nСредняя точность предсказания нейронной сети: {nn_avg_accuracy:.2%}")
    print(f"Вывод по нейронной сети: {'Последовательность криптостойкая' if nn_avg_accuracy <= 0.55 else 'Обнаружены признаки предсказуемости'}")
    
    # Анализ методом хи-квадрат
    print("\n=== АНАЛИЗ МЕТОДОМ ХИ-КВАДРАТ ===")
    stat_results = []
    stat_total_pvalue = 0
    
    for window_size in window_sizes:
        for direction in ['next', 'prev']:
            stat_result = statistical_prediction(sequence, position, window_size, window_size, direction)
            stat_results.append([
                window_size,
                'следующие' if direction == 'next' else 'предыдущие',
                stat_result['window'],
                stat_result['predicted'],
                stat_result['actual'],
                f"χ²={stat_result['chi_square']:.2f}, p={stat_result['p_value']:.3f}"
            ])
            stat_total_pvalue += stat_result['p_value']
    
    stat_avg_pvalue = stat_total_pvalue / (len(window_sizes) * 2)
    headers = ['Размер окна', 'Направление', 'Окно', 'Предсказано', 'Фактически', 'Статистика']
    print(tabulate(stat_results, headers=headers, tablefmt='grid'))
    print(f"\nСреднее p-значение: {stat_avg_pvalue:.3f}")
    print(f"Вывод по хи-квадрат: {'Последовательность криптостойкая' if stat_avg_pvalue > 0.05 else 'Обнаружены признаки предсказуемости'}")
    
    # Общее заключение
    print("\n=== ОБЩЕЕ ЗАКЛЮЧЕНИЕ ===")
    if nn_avg_accuracy <= 0.55 and stat_avg_pvalue > 0.05:
        print("Последовательность демонстрирует признаки криптографической стойкости:")
        print(f"- Точность предсказания нейронной сети ({nn_avg_accuracy:.2%}) не превышает 55%")
        print(f"- P-значение хи-квадрат теста ({stat_avg_pvalue:.3f}) больше 0.05")
    else:
        print("Последовательность имеет признаки предсказуемости:")
        print(f"- Точность предсказания нейронной сети: {nn_avg_accuracy:.2%}")
        print(f"- P-значение хи-квадрат теста: {stat_avg_pvalue:.3f}")

if __name__ == '__main__':
    filename = input("Введите путь к файлу с бинарной последовательностью: ")
    sequence = read_binary_string(filename)
    
    if sequence:
        analyze_random_position(sequence)





