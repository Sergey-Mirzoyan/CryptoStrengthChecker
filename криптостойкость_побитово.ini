import numpy as np
from tqdm import tqdm
import random
from scipy.stats import chi2
from tabulate import tabulate
from sklearn.neural_network import MLPClassifier
from collections import Counter

def read_binary_string(filename):
    """Чтение бинарной последовательности из файла"""
    try:
        with open(filename, 'r') as f:
            sequence = f.read().strip()
            if not all(bit in '01' for bit in sequence):
                print("Ошибка: файл должен содержать только 0 и 1")
                return None
            return [int(bit) for bit in sequence]
    except FileNotFoundError:
        print(f"Ошибка: файл {filename} не найден")
        return None
    except Exception as e:
        print(f"Ошибка при чтении файла: {e}")
        return None

def analyze_sequence_direction(sequence, window_size, direction='next'):
    """Анализ последовательности в одном направлении"""
    X_train = []
    y_train = []
    
    # Случайный выбор начальной позиции
    start_pos = random.randint(0, len(sequence) - window_size - 1)
    
    # Формируем обучающую выборку
    if direction == 'next':
        for i in range(start_pos, len(sequence) - window_size):
            X_train.append(sequence[i:i+window_size])
            y_train.append(sequence[i+window_size])
    else:
        for i in range(len(sequence)-1-start_pos, window_size-1, -1):
            X_train.append(sequence[i-window_size:i])
            y_train.append(sequence[i-window_size-1])
            
    if len(X_train) == 0:
        return [], 0, 0
        
    # Создаем и обучаем модель
    clf = MLPClassifier(hidden_layer_sizes=(window_size,), max_iter=5000, random_state=42)
    clf.fit(X_train, y_train)
    
    # Делаем предсказания
    predictions = []
    correct_predictions = 0
    
    if direction == 'next':
        for i in range(len(sequence) - window_size):
            window = sequence[i:i+window_size]
            actual = sequence[i+window_size]
            predicted = clf.predict([window])[0]
            predictions.append({
                'position': i+window_size,
                'window': ''.join(map(str, window)),
                'predicted': predicted,
                'actual': actual,
                'correct': predicted == actual
            })
            correct_predictions += (predicted == actual)
    else:
        for i in range(len(sequence)-1, window_size-1, -1):
            window = sequence[i-window_size:i]
            actual = sequence[i-window_size-1]
            predicted = clf.predict([window])[0]
            predictions.append({
                'position': i-window_size-1,
                'window': ''.join(map(str, window)),
                'predicted': predicted,
                'actual': actual,
                'correct': predicted == actual
            })
            correct_predictions += (predicted == actual)
    
    accuracy = correct_predictions / len(predictions) if predictions else 0
    return predictions, accuracy, len(predictions)

def statistical_prediction(sequence, window_size, direction='next'):
    """Статистический анализ методом хи-квадрат"""
    predictions = []
    total_chi_square = 0
    total_p_value = 0
    total_tests = 0
    
    # Случайный выбор начальной позиции
    start_pos = random.randint(0, len(sequence) - window_size - 1)
    
    if direction == 'next':
        for i in range(start_pos, len(sequence) - window_size):
            window = sequence[i:i+window_size]
            actual = sequence[i+window_size]
            
            # Подсчет частот для каждого бита после данного окна
            freq = Counter()
            for j in range(len(sequence)-window_size):
                if sequence[j:j+window_size] == window:
                    freq[sequence[j+window_size]] += 1
                    
            if sum(freq.values()) > 0:
                # Хи-квадрат тест
                expected = sum(freq.values()) / 2
                chi_square = sum((obs - expected) ** 2 / expected for obs in freq.values())
                p_value = 1 - chi2.cdf(chi_square, df=1)
                
                predictions.append({
                    'position': i+window_size,
                    'window': ''.join(map(str, window)),
                    'actual': actual,
                    'chi_square': chi_square,
                    'p_value': p_value
                })
                total_chi_square += chi_square
                total_p_value += p_value
                total_tests += 1
    else:
        for i in range(len(sequence)-1-start_pos, window_size-1, -1):
            window = sequence[i-window_size:i]
            actual = sequence[i-window_size-1]
            
            # Подсчет частот для каждого бита перед данным окном
            freq = Counter()
            for j in range(len(sequence)-1, window_size-1, -1):
                if sequence[j-window_size:j] == window:
                    freq[sequence[j-window_size-1]] += 1
                    
            if sum(freq.values()) > 0:
                # Хи-квадрат тест
                expected = sum(freq.values()) / 2
                chi_square = sum((obs - expected) ** 2 / expected for obs in freq.values())
                p_value = 1 - chi2.cdf(chi_square, df=1)
                
                predictions.append({
                    'position': i-window_size-1,
                    'window': ''.join(map(str, window)),
                    'actual': actual,
                    'chi_square': chi_square,
                    'p_value': p_value
                })
                total_chi_square += chi_square
                total_p_value += p_value
                total_tests += 1
    
    avg_chi_square = total_chi_square / total_tests if total_tests > 0 else 0
    avg_p_value = total_p_value / total_tests if total_tests > 0 else 0
    return predictions, avg_chi_square, avg_p_value, total_tests

def analyze_sequence(sequence):
    """Полный анализ последовательности"""
    if not sequence:
        return
    
    print("\n=== АНАЛИЗ БИТОВОЙ ПОСЛЕДОВАТЕЛЬНОСТИ ===")
    print(f"Длина последовательности: {len(sequence)} бит")
    
    window_sizes = [8, 16, 32]
    
    # Нейросетевой анализ
    print("\n=== АНАЛИЗ С ПОМОЩЬЮ НЕЙРОННОЙ СЕТИ ===")
    nn_results = []
    total_accuracy = 0
    total_analyzed = 0
    
    for window_size in window_sizes:
        for direction in ['next', 'prev']:
            predictions, accuracy, bits_analyzed = analyze_sequence_direction(sequence, window_size, direction)
            
            if bits_analyzed > 0:
                correct_bits = sum(1 for p in predictions if p['correct'])
                nn_results.append([
                    window_size,
                    'вперед' if direction == 'next' else 'назад',
                    bits_analyzed,
                    correct_bits,
                    f"{accuracy:.2%}",
                    f"{len(predictions)}"
                ])
                total_accuracy += accuracy * bits_analyzed
                total_analyzed += bits_analyzed
    
    if total_analyzed > 0:
        overall_accuracy = total_accuracy / total_analyzed
        
        headers = ['Размер окна', 'Направление', 'Проанализировано бит', 
                  'Верных предсказаний', 'Точность', 'Всего предсказаний']
        print(tabulate(nn_results, headers=headers, tablefmt='grid'))
        print(f"\nОбщая точность предсказания: {overall_accuracy:.2%}")
        print(f"Всего проанализировано бит: {total_analyzed}")
        print("\nВывод по нейронной сети:")
        if overall_accuracy <= 0.55:
            print("Последовательность демонстрирует признаки криптографической стойкости")
            print(f"- Точность предсказания ({overall_accuracy:.2%}) не превышает 55%")
        else:
            print("Последовательность имеет признаки предсказуемости")
            print(f"- Точность предсказания: {overall_accuracy:.2%}")
        
    # Анализ методом хи-квадрат
    print("\n=== АНАЛИЗ МЕТОДОМ ХИ-КВАДРАТ ===")
    stat_results = []
    total_chi_square = 0
    total_p_value = 0
    total_stat_tests = 0
    
    for window_size in window_sizes:
        for direction in ['next', 'prev']:
            predictions, avg_chi_square, avg_p_value, tests = statistical_prediction(sequence, window_size, direction)
            if tests > 0:
                stat_results.append([
                    window_size,
                    'вперед' if direction == 'next' else 'назад',
                    tests,
                    f"χ²={avg_chi_square:.2f}",
                    f"p={avg_p_value:.3f}"
                ])
                total_chi_square += avg_chi_square * tests
                total_p_value += avg_p_value * tests
                total_stat_tests += tests
    
    if total_stat_tests > 0:
        overall_chi_square = total_chi_square / total_stat_tests
        overall_p_value = total_p_value / total_stat_tests
        
        headers = ['Размер окна', 'Направление', 'Тестов', 'Среднее χ²', 'Среднее p']
        print(tabulate(stat_results, headers=headers, tablefmt='grid'))
        print(f"\nОбщее среднее χ²: {overall_chi_square:.2f}")
        print(f"Общее среднее p-значение: {overall_p_value:.3f}")
        
        print("\nВывод по методу хи-квадрат:")
        if overall_p_value > 0.05:
            print("Последовательность демонстрирует признаки криптографической стойкости")
            print(f"- P-значение ({overall_p_value:.3f}) больше 0.05")
        else:
            print("Последовательность имеет признаки предсказуемости")
            print(f"- P-значение: {overall_p_value:.3f}")
        
        # Общее заключение
        print("\n=== ОБЩЕЕ ЗАКЛЮЧЕНИЕ ===")
        if overall_accuracy <= 0.55 and overall_p_value > 0.05:
            print("Последовательность демонстрирует признаки криптографической стойкости:")
            print(f"- Точность предсказания нейронной сети ({overall_accuracy:.2%}) не превышает 55%")
            print(f"- P-значение хи-квадрат теста ({overall_p_value:.3f}) больше 0.05")
        else:
            print("Последовательность имеет признаки предсказуемости:")
            print(f"- Точность предсказания нейронной сети: {overall_accuracy:.2%}")
            print(f"- P-значение хи-квадрат теста: {overall_p_value:.3f}")
    else:
        print("Недостаточно данных для анализа")

if __name__ == '__main__':
    filename = input("Введите путь к файлу с бинарной последовательностью: ")
    sequence = read_binary_string(filename)
    
    if sequence:
        analyze_sequence(sequence)







